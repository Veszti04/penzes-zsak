workflows:
  android-apk:
    name: DowellFX APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: SDK helye
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: APK forditas
        script: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Atnevezes
        script: cp app/build/outputs/apk/release/app-release.apk DowellFX.apk
    artifacts:
      - DowellFX.apk
